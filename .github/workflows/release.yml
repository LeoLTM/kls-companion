name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/_test.yml

  build:
    needs: test
    uses: ./.github/workflows/_build.yml

  release:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/_release.yml
