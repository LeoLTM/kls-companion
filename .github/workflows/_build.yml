name: Reusable Build

on:
  workflow_call:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: kls-companion-linux-x64
            binary: kls-companion
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: kls-companion-windows-x64
            binary: kls-companion.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ponytail: install system dev headers only on Linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libgtk-3-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
